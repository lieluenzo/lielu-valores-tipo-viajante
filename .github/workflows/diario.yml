name: Imagens de valores (diário)

on:
  schedule:
    - cron: '0 8 * * *'   # 5h em Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fabricar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ler os preços no site da Lielu
        run: python3 fabrica/ler_site.py dados/site_hoje.json
      - name: Fazer as imagens (4 preços por saída)
        run: python3 fabrica/fabrica.py dados/site_hoje.json publico
      - name: Sugestões da página (só saídas que existem no site hoje)
        run: python3 fabrica/sugestoes.py dados/site_hoje.json publico
      - name: Sugestões da página V2 (Europa do Leste nos cards 1 e 2) → sugestoes_v2.json
        continue-on-error: true   # se falhar, a V2 usa a lista embutida; a V1 e as imagens seguem normais
        run: python3 fabrica/sugestoes_v2.py dados/site_hoje.json publico
      - name: Lista do dia do funil Data de Viagem (saidas_dv.json)
        continue-on-error: true
        run: python3 fabrica/saidas_dv.py dados/site_hoje.json publico
      - name: Lista do dia e imagens do funil China (saidas_china.json + china/*.png)
        continue-on-error: true
        run: |
          python3 fabrica/saidas_china.py dados/site_hoje.json publico
          python3 fabrica/fabrica_china.py publico/saidas_china.json publico
          python3 fabrica/fabrica_china_faixas.py publico/saidas_china.json publico
      - name: Imagens de período do robô do Instagram "Comente 2027" (calendario-2027/*.png)
        run: |
          # se falhar, publica as imagens de ontem (o robô aponta para endereço fixo e não pode ficar sem imagem)
          if ! python3 fabrica/calendario_2027.py dados/site_hoje.json publico; then
            echo "::warning::calendario_2027 falhou: ficam as imagens de ontem"
            rm -rf publico/calendario-2027 && mkdir -p publico/calendario-2027
            for f in jan-mar.png abr-1.png abr-2.png mai-1.png mai-2.png jun.png index.json; do
              curl -fsS -o "publico/calendario-2027/$f" "https://lieluenzo.github.io/lielu-valores-tipo-viajante/calendario-2027/$f" || true
            done
          fi
      - name: Imagens de roteiro do robô do Instagram "Comente LESTE" (europa-do-leste-2027/*.png)
        run: |
          # se falhar, publica as imagens de ontem (o robô aponta para endereço fixo e não pode ficar sem imagem)
          if ! python3 fabrica/europa_leste_2027.py dados/site_hoje.json publico; then
            echo "::warning::europa_leste_2027 falhou: ficam as imagens de ontem"
            rm -rf publico/europa-do-leste-2027 && mkdir -p publico/europa-do-leste-2027
            for f in classico.png imperiais.png imperiais-alemanha.png rota-romantica.png index.json; do
              curl -fsS -o "publico/europa-do-leste-2027/$f" "https://lieluenzo.github.io/lielu-valores-tipo-viajante/europa-do-leste-2027/$f" || true
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - id: publicar
        uses: actions/deploy-pages@v4
