name: Imagens de valores (diário)

on:
  schedule:
    - cron: '0 8 * * *'   # 5h em Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fabricar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ler os preços no site da Lielu
        run: python3 fabrica/ler_site.py dados/site_hoje.json
      - name: Fazer as imagens (4 preços por saída)
        run: python3 fabrica/fabrica.py dados/site_hoje.json publico
      - name: Sugestões da página (só saídas que existem no site hoje)
        run: python3 fabrica/sugestoes.py dados/site_hoje.json publico
      - name: Lista do dia do funil Data de Viagem (saidas_dv.json)
        continue-on-error: true
        run: python3 fabrica/saidas_dv.py dados/site_hoje.json publico
      - name: Lista do dia e imagens do funil China (saidas_china.json + china/*.png)
        continue-on-error: true
        run: |
          python3 fabrica/saidas_china.py dados/site_hoje.json publico
          python3 fabrica/fabrica_china.py publico/saidas_china.json publico
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - id: publicar
        uses: actions/deploy-pages@v4
